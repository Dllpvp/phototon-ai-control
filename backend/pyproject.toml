[project]
name = "fotoprint-backend"
version = "0.1.0"
description = "Фотопринт Контроль - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "httpx>=0.28",
    "reportlab>=4.2",
    "networkx>=3.4",
    "numpy>=2.1",
    "polars[rtcompat]>=2.1.0",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.0.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
